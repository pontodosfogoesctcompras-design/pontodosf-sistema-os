<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A4A96">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fogões OS">
<title>Ponto dos Fogões — Sistema OS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --azul:    #0A4A96;
  --azul2:   #1256B4;
  --laranja: #F57518;
  --laranja2:#FF8E11;
  --bg:      #0E0E0E;
  --bg1:     #1A1A1A;
  --bg2:     #242424;
  --bg3:     #2E2E2E;
  --texto:   #F5F5F5;
  --texto2:  #AAAAAA;
  --texto3:  #666666;
  --verde:   #22C55E;
  --azulc:   #3B82F6;
  --amarelo: #F59E0B;
  --vermelho:#EF4444;
  --roxo:    #8B5CF6;
  --borda:   rgba(255,255,255,.08);
  --borda2:  rgba(245,117,24,.25);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--texto); min-height:100vh; }
button,input,select,textarea { font-family:'Inter',sans-serif; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:var(--azul); border-radius:4px; }

/* ── LOGIN ── */
#loginScreen {
  position:fixed; inset:0; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:16px;
}
.lcard {
  background:var(--bg1); border:1px solid var(--borda);
  border-radius:20px; padding:32px 28px; width:100%; max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
.llogo {
  text-align:center; margin-bottom:28px;
}
.llogo img { width:72px; height:72px; border-radius:16px; margin-bottom:12px; }
.llogo h1 { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; }
.llogo p { font-size:11px; color:var(--texto3); letter-spacing:.12em; text-transform:uppercase; margin-top:3px; }

.perfis { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
.perfil-btn {
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; border-radius:12px;
  border:2px solid var(--borda); background:var(--bg2);
  cursor:pointer; transition:all .15s; text-align:left;
}
.perfil-btn:hover { border-color:var(--laranja); background:var(--bg3); }
.perfil-btn.selecionado { border-color:var(--laranja); background:rgba(245,117,24,.1); }
.perfil-btn.inativo { opacity:.4; cursor:not-allowed; }
.perfil-avatar {
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
}
.perfil-nome { font-size:13px; font-weight:700; color:var(--texto); }
.perfil-cargo { font-size:11px; color:var(--texto3); margin-top:1px; }
.perfil-tag {
  margin-left:auto; padding:2px 8px; border-radius:4px;
  font-size:10px; font-weight:700; flex-shrink:0;
}

.lsenha {
  width:100%; padding:13px 14px; background:var(--bg2);
  border:1px solid var(--borda); border-radius:10px;
  color:var(--texto); font-size:15px; outline:none;
  margin-bottom:12px; transition:border-color .15s;
}
.lsenha:focus { border-color:var(--laranja); }
.lentrar {
  width:100%; padding:14px; background:linear-gradient(135deg,var(--laranja),var(--laranja2));
  color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:700;
  cursor:pointer; transition:all .2s;
}
.lentrar:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(245,117,24,.4); }
.lerro { color:var(--vermelho); font-size:12px; text-align:center; margin-top:10px; min-height:18px; }

/* ── APP ── */
#app { display:none; flex-direction:column; height:100vh; }
#app.visivel { display:flex; }

/* TOPBAR */
.topbar {
  height:54px; background:var(--bg1); border-bottom:1px solid var(--borda);
  display:flex; align-items:center; padding:0 16px; gap:10px;
  flex-shrink:0; position:relative; z-index:50;
}
.tlogo {
  display:flex; align-items:center; gap:9px;
  padding-right:14px; border-right:1px solid var(--borda); flex-shrink:0;
}
.tlogo img { width:28px; height:28px; border-radius:8px; }
.tlogo-txt { font-family:'Syne',sans-serif; font-size:13px; font-weight:800; }
.tlogo-sub { font-size:9px; color:var(--laranja); display:block; margin-top:-2px; }

.tnav { display:flex; gap:2px; flex:1; overflow-x:auto; }
.tnav::-webkit-scrollbar { display:none; }
.tbtn {
  display:flex; align-items:center; gap:6px;
  padding:7px 11px; border-radius:8px; border:none;
  background:transparent; color:var(--texto3);
  font-size:12px; font-weight:500; cursor:pointer;
  white-space:nowrap; transition:all .15s;
}
.tbtn:hover { background:var(--bg2); color:var(--texto); }
.tbtn.on { background:rgba(245,117,24,.12); color:var(--laranja2); font-weight:600; }
.tbtn .tico { font-size:14px; }
.tbtn .tcnt {
  background:var(--vermelho); color:#fff; border-radius:99px;
  padding:1px 5px; font-size:9px; font-weight:800;
}

.tright { display:flex; align-items:center; gap:8px; margin-left:auto; flex-shrink:0; }
.tstatus { font-size:10px; color:var(--texto3); }
.uchip {
  display:flex; align-items:center; gap:7px;
  padding:5px 10px; background:var(--bg2);
  border:1px solid var(--borda); border-radius:99px; cursor:pointer;
}
.uav { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; }
.unm { font-size:11px; font-weight:600; }

/* ALERTA BAR */
.abar {
  background:rgba(245,117,24,.08); border-bottom:1px solid var(--borda2);
  padding:7px 16px; display:flex; align-items:center; gap:10px;
  flex-shrink:0; flex-wrap:wrap;
}
.aitem {
  display:flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600;
  background:rgba(245,117,24,.12); border:1px solid var(--borda2);
  cursor:pointer;
}
.aitem.urg { background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.3); color:#F87171; }

/* CONTENT */
.content { flex:1; overflow-y:auto; padding:20px; }
.page { display:none; }
.page.on { display:block; animation:fadeIn .18s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

/* BOTÕES */
.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px; border-radius:8px; font-size:12px; font-weight:600;
  cursor:pointer; border:none; transition:all .15s; white-space:nowrap;
}
.btn-p { background:linear-gradient(135deg,var(--laranja),var(--laranja2)); color:#fff; }
.btn-p:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(245,117,24,.4); }
.btn-g { background:var(--bg2); color:var(--texto); border:1px solid var(--borda); }
.btn-g:hover { background:var(--bg3); }
.btn-vd { background:rgba(34,197,94,.1); color:var(--verde); border:1px solid rgba(34,197,94,.25); }
.btn-az { background:rgba(59,130,246,.1); color:var(--azulc); border:1px solid rgba(59,130,246,.25); }
.btn-wa { background:#25D366; color:#fff; }
.btn-wa:hover { background:#1da851; }
.btn-vm { background:rgba(239,68,68,.1); color:var(--vermelho); border:1px solid rgba(239,68,68,.2); }
.btn-am { background:rgba(245,158,11,.1); color:var(--amarelo); border:1px solid rgba(245,158,11,.2); }
.btn-sm { padding:5px 10px; font-size:11px; }
.btn-xs { padding:3px 8px; font-size:10px; }
.btn-lg { padding:12px 22px; font-size:14px; }

/* STATS */
.stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; margin-bottom:18px; }
.sc {
  background:var(--bg1); border:1px solid var(--borda); border-radius:12px;
  padding:15px; cursor:pointer; transition:all .2s; position:relative; overflow:hidden;
}
.sc::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--acc,var(--laranja)); }
.sc:hover { transform:translateY(-2px); border-color:var(--acc,var(--laranja)); }
.sc-ico { font-size:20px; margin-bottom:9px; }
.sc-val { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; color:var(--acc,var(--texto)); }
.sc-lbl { font-size:11px; color:var(--texto3); margin-top:4px; }

/* CARD */
.card { background:var(--bg1); border:1px solid var(--borda); border-radius:12px; padding:18px; }
.ctitle { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

/* KANBAN */
.kanban { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.kcol { background:var(--bg1); border:1px solid var(--borda); border-radius:12px; overflow:hidden; min-height:400px; }
.khead { padding:10px 13px; border-bottom:1px solid var(--borda); display:flex; align-items:center; justify-content:space-between; border-top:3px solid var(--kc,var(--laranja)); }
.khtitle { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--kc,var(--texto)); }
.khcnt { background:var(--bg3); border-radius:99px; padding:2px 7px; font-size:10px; font-weight:700; }
.kbody { padding:8px; display:flex; flex-direction:column; gap:6px; min-height:340px; }
.kbody.dov { background:rgba(245,117,24,.06); }
.kcard {
  background:var(--bg2); border:1px solid var(--borda); border-radius:8px;
  padding:11px; cursor:pointer; transition:all .15s;
  border-left:3px solid var(--kc,var(--borda));
}
.kcard:hover { background:var(--bg3); transform:translateY(-1px); }
.kcard.drag { opacity:.4; }
.kc-num { font-family:'Syne',sans-serif; font-size:10px; font-weight:800; color:var(--laranja); }
.kc-cli { font-size:12px; font-weight:700; margin:3px 0 2px; }
.kc-item { font-size:10px; color:var(--texto3); line-height:1.35; }
.kc-ft { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.kc-val { font-size:11px; font-weight:800; color:var(--laranja2); }
.kc-data { font-size:10px; color:var(--texto3); }
.kc-btns { display:flex; gap:4px; margin-top:7px; }

/* TABELA */
.tw { background:var(--bg1); border:1px solid var(--borda); border-radius:12px; overflow:hidden; }
.ttbar { padding:11px 13px; border-bottom:1px solid var(--borda); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.busca { display:flex; align-items:center; gap:7px; background:var(--bg2); border:1px solid var(--borda); border-radius:8px; padding:7px 11px; flex:1; max-width:280px; }
.busca input { background:none; border:none; color:var(--texto); font-size:12px; outline:none; width:100%; }
.busca input::placeholder { color:var(--texto3); }
.pill { padding:4px 10px; border-radius:99px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--borda); background:transparent; color:var(--texto3); transition:all .15s; }
.pill:hover,.pill.on { background:rgba(245,117,24,.1); color:var(--laranja2); border-color:var(--borda2); }
table { width:100%; border-collapse:collapse; }
thead th { padding:9px 12px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--texto3); text-align:left; border-bottom:1px solid var(--borda); white-space:nowrap; }
tbody tr { border-bottom:1px solid rgba(255,255,255,.03); cursor:pointer; transition:background .1s; }
tbody tr:hover { background:rgba(245,117,24,.04); }
tbody td { padding:10px 12px; font-size:12px; vertical-align:middle; }
.td-os { font-family:'Syne',sans-serif; font-weight:800; color:var(--laranja); }
.td-val { font-family:'Syne',sans-serif; font-weight:800; color:var(--laranja2); }
.td-nm { font-weight:600; }
.tfoot { padding:10px 13px; border-top:1px solid var(--borda); display:flex; align-items:center; justify-content:space-between; }
.tinfo { font-size:11px; color:var(--texto3); }
.tpags { display:flex; gap:4px; }
.tpbtn { width:28px; height:28px; border-radius:4px; border:1px solid var(--borda); background:transparent; color:var(--texto3); cursor:pointer; font-size:11px; font-weight:700; transition:all .15s; }
.tpbtn:hover,.tpbtn.on { background:rgba(245,117,24,.1); color:var(--laranja2); border-color:var(--borda2); }

/* CHIPS STATUS */
.chip { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px; font-size:10px; font-weight:700; white-space:nowrap; }
.chip::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }
.ch-E  { background:rgba(34,197,94,.1);   color:#4ade80; }
.ch-P  { background:rgba(59,130,246,.1);  color:#7BA7F5; }
.ch-A  { background:rgba(245,158,11,.1);  color:#FBB040; }
.ch-AP { background:rgba(139,92,246,.1);  color:#A78BFA; }
.ch-NA { background:rgba(249,115,22,.1);  color:#FB923C; }
.ch-C  { background:rgba(107,114,128,.1); color:#9CA3AF; }
.ch-D  { background:rgba(239,68,68,.1);   color:#F87171; }
.ch-PC { background:rgba(20,184,166,.1);  color:#2DD4BF; }
.te { background:rgba(59,130,246,.15);  color:#7BA7F5; border-radius:4px; padding:2px 7px; font-size:10px; font-weight:800; }
.tp { background:rgba(34,197,94,.15);   color:#4ade80;  border-radius:4px; padding:2px 7px; font-size:10px; font-weight:800; }

/* MODAL */
.ov { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:500; opacity:0; pointer-events:none; transition:opacity .2s; backdrop-filter:blur(6px); padding:16px; }
.ov.on { opacity:1; pointer-events:all; }
.modal { background:var(--bg1); border:1px solid var(--borda); border-radius:16px; width:100%; max-width:700px; max-height:90vh; overflow-y:auto; box-shadow:0 32px 96px rgba(0,0,0,.7); transform:translateY(12px); transition:transform .2s; }
.ov.on .modal { transform:translateY(0); }
.mhead { padding:18px 20px 14px; border-bottom:1px solid var(--borda); display:flex; align-items:center; justify-content:space-between; gap:10px; position:sticky; top:0; background:var(--bg1); z-index:1; }
.mtitle { font-family:'Syne',sans-serif; font-size:17px; font-weight:800; }
.macoes { display:flex; gap:6px; align-items:center; }
.mclose { background:var(--bg2); border:1px solid var(--borda); color:var(--texto3); width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.mclose:hover { color:var(--texto); background:var(--bg3); }
.mbody { padding:18px 20px 22px; }

/* FORM */
.fg { display:flex; flex-direction:column; gap:5px; }
.fg label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--texto3); }
.fg input,.fg select,.fg textarea { background:var(--bg2); border:1px solid var(--borda); border-radius:8px; padding:9px 12px; color:var(--texto); font-size:13px; outline:none; transition:border-color .15s; }
.fg input:focus,.fg select:focus,.fg textarea:focus { border-color:var(--laranja); }
.fg select option { background:var(--bg1); }
.fg textarea { resize:vertical; min-height:64px; line-height:1.5; }
.fgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fc2 { grid-column:1/-1; }
.ibloco { background:var(--bg2); border:1px solid var(--borda); border-radius:8px; padding:13px; margin-bottom:10px; }
.ibhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.ibtitle { font-size:11px; font-weight:700; color:var(--laranja2); }

/* INFO GRID */
.ig { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.igitem { background:var(--bg2); border-radius:8px; padding:11px; border:1px solid var(--borda); }
.igk { font-size:10px; color:var(--texto3); margin-bottom:3px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
.igv { font-size:13px; font-weight:500; }
.iln { background:var(--bg2); border-radius:8px; padding:11px 13px; margin-bottom:7px; display:flex; align-items:flex-start; gap:10px; border:1px solid var(--borda); }
.iln-n { width:22px; height:22px; border-radius:4px; background:rgba(245,117,24,.15); color:var(--laranja2); font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.iln-ap { font-size:13px; font-weight:600; }
.iln-ht { font-size:11px; color:var(--texto3); margin-top:2px; line-height:1.4; }
.iln-vl { font-family:'Syne',sans-serif; font-weight:800; color:var(--laranja2); font-size:13px; flex-shrink:0; }

/* STATUS PILLS */
.spills { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.spill { padding:6px 12px; border-radius:99px; font-size:11px; font-weight:700; cursor:pointer; border:1px solid transparent; transition:all .15s; }
.spill.on { border-color:currentColor; box-shadow:0 0 0 2px currentColor; }

/* WA */
.wabox { background:rgba(37,211,102,.05); border:1px solid rgba(37,211,102,.18); border-radius:12px; padding:14px; }
.watitle { color:var(--verde); font-size:12px; font-weight:700; margin-bottom:10px; }
.wamsg { background:var(--bg2); border-radius:8px; padding:11px; font-size:11px; line-height:1.65; white-space:pre-wrap; max-height:140px; overflow-y:auto; margin-bottom:10px; }
.wabtns { display:flex; gap:7px; flex-wrap:wrap; }
.watbns { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }

/* BARRAS */
.bar { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
.barlbl { font-size:11px; color:var(--texto3); width:76px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bartr { flex:1; height:5px; background:var(--bg3); border-radius:99px; overflow:hidden; }
.barfl { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--laranja),var(--laranja2)); }
.barval { font-size:11px; font-weight:700; min-width:70px; text-align:right; }
.fatrow { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--borda); }
.fatrow:last-child { border:none; }

/* GARANTIAS */
.gcard { background:var(--bg1); border:1px solid var(--borda); border-radius:12px; padding:13px; margin-bottom:7px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:all .15s; }
.gcard:hover { border-color:var(--borda2); }
.gdias { width:48px; height:48px; border-radius:8px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.gd-n { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; line-height:1; }
.gd-s { font-size:9px; font-weight:700; text-transform:uppercase; }
.gurg { background:rgba(239,68,68,.15); color:#F87171; }
.gat  { background:rgba(245,158,11,.15); color:#FBB040; }
.gok  { background:rgba(34,197,94,.12);  color:#4ade80; }

/* CLIENTES */
.clicard { background:var(--bg1); border:1px solid var(--borda); border-radius:12px; padding:14px; margin-bottom:8px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:13px; }
.clicard:hover { border-color:var(--laranja); }
.cliav { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; flex-shrink:0; font-family:'Syne',sans-serif; }
.cliinfo { flex:1; }
.clinom { font-size:14px; font-weight:700; }
.clitel { font-size:11px; color:var(--texto3); margin-top:2px; }
.clistat b { color:var(--laranja2); }

/* TOAST */
#toast { position:fixed; bottom:22px; right:22px; z-index:9999; background:var(--bg2); border:1px solid var(--borda2); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:500; box-shadow:0 8px 32px rgba(0,0,0,.5); transform:translateY(80px); transition:transform .3s; display:flex; align-items:center; gap:10px; max-width:320px; pointer-events:none; }
#toast.show { transform:translateY(0); }

/* MOBILE */
@media (max-width:768px) {
  .topbar { position:fixed; top:0; left:0; right:0; z-index:100; }
  #app { padding-top:54px; padding-bottom:64px; }
  .tnav { display:none; }
  .content { padding:12px; }

  APPS_SCRIPT_URL: ''

async function backendGet(acao){
  if(!APP_CONFIG.APPS_SCRIPT_URL) throw new Error('URL do Apps Script não configurada.');
  const url = APP_CONFIG.APPS_SCRIPT_URL + (APP_CONFIG.APPS_SCRIPT_URL.includes('?')?'&':'?') + 'acao=' + encodeURIComponent(acao);
  const r = await fetch(url, {cache:'no-store'});
  const d = await r.json();
  if(!d.ok) throw new Error(d.erro || 'Erro no Apps Script');
  return d;
}

async function backendPost(payload){
  if(!APP_CONFIG.APPS_SCRIPT_URL) throw new Error('URL do Apps Script não configurada.');
  const r = await fetch(APP_CONFIG.APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });
  const d = await r.json();
  if(!d.ok) throw new Error(d.erro || 'Erro no Apps Script');
  return d;
}

function normalizarOSServidor(o){
  o = o || {};

    ap:i.ap||'',
    servico:i.servico||'',
    historico:i.historico||i.hist||'',
    hist:i.historico||i.hist||i.servico||'',
    val:Number(i.val)||0,
    gar:Number(i.gar)||30
  })) : [];
  if(!o.itens.length) o.itens=[{ap:'',servico:'',historico:'',hist:'',val:0,gar:30}];
  o.tel=(o.tel||'').replace(/\D/g,'');
  return o;
}

async function carregarDoServidor(){
  if(!APP_CONFIG.APPS_SCRIPT_URL) {
    mostrarStatusBackend('🟡 Local');
    return false;
  }
  try{
    mostrarStatusBackend('🔄 Carregando');
    const d=await backendGet('lista');
    OS=(d.dados||[]).map(normalizarOSServidor);
    salvarLocalSilencioso();
    backendOnline=true;

    return true;
  }catch(e){
    backendOnline=false;
    mostrarStatusBackend('🟡 Offline');
    console.warn('Apps Script:',e);
    return false;
  }
}

//  BUSCA DE CLIENTE POR TELEFONE
// ════════════════════════════════════════════
function buscarClientePorTel(tel) {
  const t = tel.replace(/\D/g,'');
  if (t.length < 8) return;

  // Buscar nas OSs existentes
  const encontrado = OS.find(o => {
    const ot = (o.tel||'').replace(/\D/g,'');
    return ot.endsWith(t) || t.endsWith(ot.slice(-8));
  });

  const fCli = document.getElementById('fCli');
  const aviso = document.getElementById('avisoCliente');

  if (encontrado) {
    fCli.value = encontrado.cliente;
    fCli.style.borderColor = 'var(--verde)';
    if (aviso) {
      aviso.innerHTML = `✅ Cliente encontrado: <b>${encontrado.cliente}</b> — ${OS.filter(o=>(o.tel||'').replace(/\D/g,'').endsWith(t.slice(-8))).length} OS(s) anteriores`;
      aviso.style.color = 'var(--verde)';
    }
  } else if (t.length >= 10) {
    fCli.style.borderColor = 'var(--amarelo)';
    if (aviso) {
      aviso.innerHTML = '⚠️ Novo cliente — será cadastrado automaticamente';
      aviso.style.color = 'var(--amarelo)';
    }
  }
}

function sN(s){
  s=(s||'').toUpperCase().trim();
  if(s.includes('ENTREGUE')) return 'E';
  if(s.includes('PRONTO')) return 'P';
  if(s.includes('CANCELADO')) return 'C';
  if(s.includes('DESCARTE')) return 'D';
  if(s.includes('NÃO APROVADO')||s.includes('NAO APROVADO')) return 'NA';
  if(s.includes('PEÇA')||s.includes('PECA')) return 'PC';
  if(s.includes('APROVAÇÃO')||s.includes('APROVACAO')) return 'AP';
  return 'A';
}

const PRAZOS = {
  'ELÉTRICOS':         30,
  'MICROONDAS':        30,
  'SERVIÇOS':          30,
  'LIQUIDIFICADORES':  20,
  'PANELAS':           10,
  'OUTROS':            10,
};

function calcularEntrega(setor, dataEntrada) {
  const prazo = PRAZOS[setor] || 15;
  const d = new Date(dataEntrada);
  d.setDate(d.getDate() + prazo);
  return d.toISOString().split('T')[0];
}

function atualizarPrazoEntrega() {
  const setor  = document.getElementById('fSet')?.value || 'ELÉTRICOS';
  const data   = document.getElementById('fData')?.value;
  const fEnt   = document.getElementById('fEnt');
  if (fEnt && data) {
    fEnt.value = calcularEntrega(setor, data);
    const prazo = PRAZOS[setor] || 15;
    const lblPrazo = document.getElementById('lblPrazo');
    if (lblPrazo) lblPrazo.textContent = `(${prazo} dias para ${setor})`;
  }
}

function verificarAlertas(){
  const prontas = OS.filter(o=>sN(o.status)==='P');
  const urg = prontas.filter(o=>dias(o.entrada)>5);
  document.title = prontas.length>0?`(${prontas.length}) Ponto dos Fogões`:'Ponto dos Fogões';
  const bar = document.getElementById('aBar');
  const lista = document.getElementById('aLista');
  const alertas = [];
  if(prontas.length) alertas.push(`🔵 ${prontas.length} pronta${prontas.length>1?'s':''} p/ retirada`);
  if(urg.length) alertas.push(`⚠️ ${urg.length} prontas há +5 dias`);
  if(alertas.length){
    bar.style.display='flex';
    lista.innerHTML = alertas.map((a,i)=>`<span class="aitem${i===1?' urg':''}">${a}</span>`).join('');
    if(urg.length) tocarSom();
  } else { bar.style.display='none'; }
}
function tocarSom(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [440,554,659].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=f; g.gain.setValueAtTime(.12,ctx.currentTime+i*.15);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.15+.25);
      o.start(ctx.currentTime+i*.15); o.stop(ctx.currentTime+i*.15+.3);
    });
  }catch(e){}
}

  ti.textContent=`${tot} OSs — pág. ${pag}/${totP}`;
  tb.innerHTML=sl.map(o=>`

async function mudStatus(n,s,el){
  const o=OS.find(x=>x.os===n); if(!o) return;
  const anterior=o.status;
  o.status=s;
  salvar();
  if(APP_CONFIG.APPS_SCRIPT_URL){
    try{
      await backendPost({acao:'atualizarStatus',os:n,status:s});
      backendOnline=true;
    }catch(e){
      o.status=anterior; salvar();
      toast('❌ Não foi possível atualizar a planilha: '+e.message);
      return;
    }
  }
  document.querySelectorAll('#mOSb .spill').forEach(b=>b.classList.remove('on'));
  if(el) el.classList.add('on');
  toast(`✅ OS #${n} → ${s}`);
  verificarAlertas();
}

function trocarWA(n,tipo,el){
  const o=OS.find(x=>x.os===n); if(!o) return;
  document.getElementById('waMsgD').textContent=montarMsg(o,tipo);
  document.getElementById('waLinkD').href=waLink(o,tipo);
  document.querySelectorAll('#mOSb .watbns .btn').forEach(b=>b.classList.remove('btn-az'));
  el.classList.add('btn-az');
}

function editarOS(n){
  const o=OS.find(x=>x.os===n); if(!o) return;
  fechar('ovOS');
  setTimeout(()=>{
    osEditando=n;
    document.getElementById('fOs').value=o.os;
    document.getElementById('fData').value=o.entrada||'';
    document.getElementById('fCli').value=o.cliente||'';
    document.getElementById('fTel').value=o.tel||'';
    document.getElementById('fSet').value=o.setor||'ELÉTRICOS';
    document.getElementById('fAtt').value=o.atendente||'';
    document.getElementById('fStt').value=o.status||'AGUARDANDO ORÇAMENTO';
    document.getElementById('fEnt').value=o.entrega||'';
    document.getElementById('fObs').value=o.obs||'';
    const fe=document.getElementById('fEntTaxa'); if(fe) fe.value=o.entradaTaxa||'';
    const fa=document.getElementById('fDataAprov'); if(fa) fa.value=o.dataAprovacao||'';
    const fp=document.getElementById('fPrevOrc'); if(fp) fp.value=o.prevOrc||'';
    const fm=document.getElementById('fPrevOrcMin'); if(fm) fm.value=o.prevOrcMin||'';
    const fr=document.getElementById('fRespTec'); if(fr) fr.value=o.respTecnico||'';
    const fg2=document.getElementById('fGarOrdem'); if(fg2) fg2.value=o.garantiasOrdem||'';
    iIdx=0; document.getElementById('fItens').innerHTML='';
    o.itens.forEach(it=>addItem(it));
    const tit=document.getElementById('novaOSTitulo');
    const btn=document.getElementById('btnSalvarOS');
    if(tit) tit.textContent=`✏️ Editando OS #${n}`;
    if(btn){ btn.textContent='💾 Salvar Alterações'; btn.onclick=()=>salvarOSForm(); }
    ir('novaOS');
  },100);
}

async function delOS(n){
  // A base oficial não deve apagar fisicamente a linha.
  // Mantemos o histórico e marcamos como CANCELADO.
  if(!confirm(`Cancelar OS #${n}? A O.S. será mantida no histórico como CANCELADO.`)) return;
  const o=OS.find(x=>x.os===n); if(!o) return;
  o.status='CANCELADO'; salvar();
  if(APP_CONFIG.APPS_SCRIPT_URL){
    try{ await backendPost({acao:'atualizarStatus',os:n,status:'CANCELADO'}); }
    catch(e){ toast('❌ Falha ao atualizar planilha: '+e.message); return; }
  }
  fechar('ovOS'); renderLista(); verificarAlertas();
  toast(`⚫ OS #${n} → CANCELADO`);
}

function addItem(dados=null){

      ${iIdx>1?`<button class="btn btn-vm btn-xs" onclick="document.getElementById('ib${iIdx}').remove()">✕ Remover</button>`:''}

    <div class="fgrid">

      <div class="fg fc2"><label>Histórico</label><textarea id="iht${iIdx}" placeholder="Observações, defeito, condição, histórico...">${historico}</textarea></div>
      <div class="fg"><label>Valor (R$)</label><input type="number" id="ivl${iIdx}" value="${dados?.val||''}" placeholder="0,00" step="0.01" min="0"></div>
      <div class="fg"><label>Garantia (dias)</label><input type="number" id="iga${iIdx}" value="${dados?.gar||30}" min="0"></div>
    </div>`;
  document.getElementById('fItens').appendChild(d);
}

function getItens(){
  const its=[];
  for(let i=1;i<=iIdx;i++){
    const ap=document.getElementById(`iap${i}`)?.value.trim();
    const servico=document.getElementById(`isv${i}`)?.value.trim()||'';
    const historico=document.getElementById(`iht${i}`)?.value.trim()||'';
    const val=parseFloat(document.getElementById(`ivl${i}`)?.value)||0;
    const gar=parseInt(document.getElementById(`iga${i}`)?.value)||30;
    if(!ap && !servico && !historico && !val) continue;
    its.push({ap,servico,historico,hist:historico||servico,val,gar});
  }
  return its;
}

async function carregarProximoOSNoFormulario(){
  const campo=document.getElementById('fOs');
  if(!campo || osEditando) return;
  try{
    if(APP_CONFIG.APPS_SCRIPT_URL){
      const d=await backendGet('proximoOS');
      campo.value=d.os;
    }else{
      campo.value=proxOS();
    }
  }catch(e){ campo.value=proxOS(); }
}

async function salvarOSForm(){
  const cli=(document.getElementById('fCli')?.value||'').trim();
  if(!cli){ toast('⚠️ Informe o cliente'); return null; }
  const itens=getItens();
  if(!itens.length){ toast('⚠️ Adicione ao menos 1 item'); return null; }

  const agora2 = new Date();
  const dataEntradaCompleta = document.getElementById('fData')?.value?.slice(0,10) || agora2.toISOString().split('T')[0];
  const setor2 = document.getElementById('fSet')?.value || 'ELÉTRICOS';
  const entrega2 = document.getElementById('fEnt')?.value || calcularEntrega(setor2, dataEntradaCompleta);
  let numOS = parseInt(document.getElementById('fOs')?.value) || 0;

  // Número oficial vem do servidor. Nunca usamos o contador local para confirmar gravação.
  if(!osEditando && APP_CONFIG.APPS_SCRIPT_URL){
    try{ const d=await backendGet('proximoOS'); numOS=Number(d.os); }
    catch(e){ toast('❌ Não consegui obter o próximo número da planilha: '+e.message); return null; }
  }
  if(!numOS) numOS=proxOS();

  const n={
    os:numOS, cliente:cli, tel:(document.getElementById('fTel')?.value||'').replace(/\D/g,''),
    setor:setor2, atendente:document.getElementById('fAtt')?.value||'', itens,
    status:document.getElementById('fStt')?.value||'AGUARDANDO ORÇAMENTO',
    entrada:dataEntradaCompleta, entrega:entrega2,
    entradaTaxa:parseFloat(document.getElementById('fEntTaxa')?.value)||0,
    dataAprovacao:document.getElementById('fDataAprov')?.value||'',
    prevOrc:document.getElementById('fPrevOrc')?.value||'',
    prevOrcMin:parseFloat(document.getElementById('fPrevOrcMin')?.value)||0,
    respTecnico:document.getElementById('fRespTec')?.value||'',
    garantiasOrdem:document.getElementById('fGarOrdem')?.value||'',
    obs:document.getElementById('fObs')?.value||'',
    valorTotal:itens.reduce((s,i)=>s+(Number(i.val)||0),0)
  };

  const antigoIndex=OS.findIndex(x=>x.os===numOS);
  const antigo=antigoIndex>=0?OS[antigoIndex]:null;
  if(osEditando && antigoIndex<0){ toast('❌ O.S. original não encontrada no sistema.'); return null; }

  try{
    if(APP_CONFIG.APPS_SCRIPT_URL){
      const acao=osEditando?'atualizarOS':'novaOS';
      const d=await backendPost({acao,os:n});
      if(d.os) n.os=Number(d.os);
      backendOnline=true;
    }
    if(antigoIndex>=0) OS[antigoIndex]=n; else OS.unshift(n);
    salvar();
    sincronizarCliente(n);
    toast(`✅ OS #${n.os} — ${cli} ${osEditando?'atualizada':'salva'} na planilha!`);
    verificarAlertas();
    osEditando=null;
    const btn=document.getElementById('btnSalvarOS'); if(btn){btn.textContent='💾 Salvar OS';btn.onclick=salvarOSForm;}
    const tit=document.getElementById('novaOSTitulo'); if(tit) tit.textContent='Nova OS';
    limparForm();
    return n;
  }catch(e){
    toast('❌ O.S. NÃO gravada na planilha: '+e.message);
    return null;
  }
}

        ${o.respTecnico?`<div style="border:1px solid #eee;border-radius:8px;padding:10px 16px;text-align:center">
          <div style="font-size:10px;color:#999;font-weight:700">RESP. TÉCNICO</div>
          <div style="font-size:14px;font-weight:700">${o.respTecnico}</div>
        </div>`:''}
        ${o.dataAprovacao?`<div style="border:1px solid #eee;border-radius:8px;padding:10px 16px;text-align:center">
          <div style="font-size:10px;color:#999;font-weight:700">DATA APROVAÇÃO</div>
          <div style="font-size:14px;font-weight:700">${fD(o.dataAprovacao)}</div>
        </div>`:''}
        <div style="border:2px solid #F57518;border-radius:8px;padding:12px 20px;text-align:right;margin-left:auto">
          ${o.entradaTaxa?`<div style="font-size:10px;color:#999">ENTRADA: ${R(o.entradaTaxa)}</div>`:''}
          <div style="font-size:11px;color:#666">TOTAL A PAGAR</div>
          <div style="font-size:24px;font-weight:900;color:#F57518">${R(totOS(o))}</div>
          ${o.entradaTaxa?`<div style="font-size:11px;color:#22C55E;font-weight:700">SALDO: ${R(totOS(o)-o.entradaTaxa)}</div>`:''}
        </div>
      </div>
      ${o.obs?`<div style="border:1px solid #eee;border-radius:6px;padding:10px;margin-bottom:14px"><div style="font-size:10px;color:#999;font-weight:700;margin-bottom:4px">OBSERVAÇÕES</div><div style="font-size:12px">${o.obs}</div></div>`:''}
      <div style="text-align:center;font-size:11px;color:#999;border-top:1px solid #eee;padding-top:10px">
        Garantia: ${o.itens[0]?.gar||30} dias | Obrigado pela preferência! 🔥
      </div>
    </div>`;
  fechar('ovOS');
  abrir('ovPrint');
}

function imprimirRel(){
  const d=new Date().toLocaleDateString('pt-BR');
  const fat=OS.reduce((s,o)=>s+totOS(o),0);
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>Relatório Ponto dos Fogões</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}th{background:#0A4A96;color:#fff;padding:8px;text-align:left;font-size:11px}td{padding:7px 8px;border-bottom:1px solid #eee;font-size:12px}</style></head><body>
    <h2 style="color:#F57518">Ponto dos Fogões — Relatório de OSs</h2>
    <p style="color:#666;margin-bottom:16px">${d} | ${OS.length} OSs | ${R(fat)}</p>
    <table><thead><tr><th>OS</th><th>Cliente</th><th>Setor</th><th>Aparelho</th><th>Atendente</th><th>Status</th><th>Valor</th><th>Entrada</th></tr></thead>
    <tbody>${OS.map(o=>`<tr><td><b>#${o.os}</b></td><td>${o.cliente}</td><td>${o.setor}</td><td>${o.itens[0]?.ap||'—'}</td><td>${o.atendente||'—'}</td><td>${o.status}</td><td style="font-weight:700;color:#F57518">${R(totOS(o))}</td><td>${fD(o.entrada)}</td></tr>`).join('')}</tbody>
    </table></body></html>`);
  w.document.close(); w.print();
}

function exportCSV(){
  const h='OS,Cliente,Telefone,Setor,Aparelho,Serviço,Atendente,Status,Valor,Entrada/Taxa,Entrada,Entrega,Resp.Técnico,DataAprovação,PrevOrç,PrevOrçMin\n';
  const r=OS.flatMap(o=>o.itens.map(it=>`${o.os},"${o.cliente}","${o.tel}","${o.setor}","${it.ap}","${it.hist}","${o.atendente}","${o.status}",${it.val},${o.entradaTaxa||0},"${fD(o.entrada)}","${fD(o.entrega)}","${o.respTecnico||''}","${fD(o.dataAprovacao)}","${fD(o.prevOrc)}",${o.prevOrcMin||0}`)).join('\n');
  const b=new Blob(['\ufeff'+h+r],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=`PontoDosF_${new Date().toISOString().split('T')[0]}.csv`; a.click();
  toast('⬇️ CSV exportado!');
}

// ── OVERLAY ──────────────────────────────────────────────────────────────
const abrir=id=>document.getElementById(id)?.classList.add('on');
const fechar=id=>document.getElementById(id)?.classList.remove('on');
function copiar(id){ navigator.clipboard.writeText(document.getElementById(id)?.textContent||'').then(()=>toast('📋 Copiado!')); }

// ── TOAST ──────────────────────────────────────────────────────────────────
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }

// ── TECLADO ────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ ['ovOS','ovWA','ovPrint'].forEach(fechar); }
  if(e.ctrlKey&&e.key==='n'&&usuario){ e.preventDefault(); ir('novaOS'); }
});

// ── TOUCH SWIPE ───────────────────────────────────────────────────────────
let ty=0;
document.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{ if(e.changedTouches[0].clientY-ty>80) ['ovOS','ovWA','ovPrint'].forEach(fechar); },{passive:true});

// ── INIT ────────────────────────────────────────────────────────────────────
carregar();
initLogin();
carregarDoServidor();
</script>
